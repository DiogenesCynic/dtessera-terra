name: Build Dtessera Terra (Windows, Mac, Web, Android, Linux)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller
          pyinstaller --noconsole --onefile --clean --name "Dtessera_Terra" "Dtessera Terra.py"
      - uses: actions/upload-artifact@v7
        with:
          name: Dtessera_Terra_Windows_Beta
          path: dist/Dtessera_Terra.exe

  build_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller
          pyinstaller --noconsole --onedir --clean --name "Dtessera_Terra" "Dtessera Terra.py"
          cd dist && zip -r -q Dtessera_Terra_Mac.app.zip Dtessera_Terra.app
      - uses: actions/upload-artifact@v7
        with:
          name: Dtessera_Terra_Mac_Beta
          path: dist/Dtessera_Terra_Mac.app.zip

  build_android_and_web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12, JDK 21 & Gradle 8.11.1
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Prepare Mobile-Safe Source & Build Pygbag Bundle
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pygbag

          # Remove non-game helper scripts so Pygbag only packs the game
          rm -f "Item Inventory.py" simulate_1000.py generate_map.py main.py

          python3 - << 'EOF'
          import ast, pathlib, re, sys

          src = pathlib.Path("Dtessera Terra.py").read_text(encoding="utf-8")

          if "import asyncio" not in src:
              src = "import asyncio\n" + src

          # Replace top-level desktop SysFont scans with instant built-in Pygame font
          sysfont_patch = (
              "import pygame\n"
              "pygame.font.init()\n"
              "_orig_font = pygame.font.Font\n"
              "pygame.font.SysFont = lambda name, size, bold=False, italic=False: _orig_font(None, int(size * 1.22))"
          )
          src = re.sub(r'^import pygame\s*$', sysfont_patch, src, count=1, flags=re.MULTILINE)
          src = src.replace("pygame.Surface((WIDTH, HEIGHT)).convert()", "pygame.Surface((WIDTH, HEIGHT))")

          # Auto-declare every top-level variable assigned inside async def main() as global
          tree = ast.parse(src)

          def scan_stores(node, target_set):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef, ast.Lambda)):
                  return
              if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Store):
                  target_set.add(node.id)
              for child in ast.iter_child_nodes(node):
                  scan_stores(child, target_set)

          top_vars = set()
          for stmt in tree.body:
              scan_stores(stmt, top_vars)

          main_node = next(
              (n for n in tree.body if isinstance(n, ast.AsyncFunctionDef) and n.name == "main"),
              None
          )
          if not main_node:
              print("ERROR: 'async def main():' was not found in Dtessera Terra.py!", file=sys.stderr)
              sys.exit(1)

          assigned_in_main = set()
          for stmt in main_node.body:
              scan_stores(stmt, assigned_in_main)

          arg_names = {a.arg for a in main_node.args.args}
          needed_globals = sorted((top_vars & assigned_in_main) - arg_names)
          if needed_globals:
              lines = src.splitlines(keepends=True)
              first_body_line = main_node.body[0].lineno - 1
              indent = re.match(r'^([ \t]*)', lines[first_body_line]).group(1)
              lines.insert(first_body_line, f"{indent}global {', '.join(needed_globals)}\n")
              src = "".join(lines)
              print("Auto-declared globals in main():", needed_globals)

          # ONLY inject await asyncio.sleep(0) into the while True inside async def main()
          m_main = re.search(r'^async\s+def\s+main\s*\([^)]*\)\s*:', src, flags=re.MULTILINE)
          head = src[:m_main.start()]
          tail = src[m_main.start():]

          def add_sleep(match):
              while_line, indent, next_line = match.group(1), match.group(2), match.group(3)
              if "await asyncio.sleep" in next_line:
                  return match.group(0)
              return f"{while_line}{indent}await asyncio.sleep(0)\n{indent}{next_line}"

          tail = re.sub(
              r'(\n[ \t]+while\s+True\s*:\s*\n)([ \t]+)([^\n]+)',
              add_sleep,
              tail,
              count=1
          )
          src = head + tail

          src = re.sub(
              r'if\s+__name__\s*==\s*["\']__main__["\']\s*:\s*\n\s*asyncio\.run\(main\(\)\)',
              'asyncio.run(main())',
              src
          )
          if "asyncio.run(main())" not in src:
              src += "\nasyncio.run(main())\n"

          pathlib.Path("main.py").write_text(src, encoding="utf-8")
          pathlib.Path("Dtessera Terra.py").unlink()
          EOF

          # Fail immediately here if any Python file has a syntax error
          python3 -m py_compile *.py

          pygbag --ume_block 0 --build .
          sed -i 's/autorun : 0/autorun : 1/g' build/web/index.html
          sed -i 's/ume_block : 1/ume_block : 0/g' build/web/index.html

          # Confirm index.html is right at the top of build/web
          test -f build/web/index.html

      - name: Upload Web & iOS Bundle (Ready for itch.io - No Unzip Needed)
        uses: actions/upload-artifact@v7
        with:
          name: Dtessera_Terra_Web_Beta
          path: build/web

      - name: Build Pure Native Android SDK 35 APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          mkdir -p android_native/app/src/main/java/com/noburu/dtesseraterra
          mkdir -p android_native/app/src/main/assets/public

          # Generate Android adaptive & legacy launcher icons from app_icon.png
          python -m pip install -q pillow
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageOps

          if not os.path.exists("app_icon.png"):
              raise SystemExit("ERROR: Upload app_icon.png to the repository root first.")

          src = Image.open("app_icon.png").convert("RGBA")
          res_dir = "android_native/app/src/main/res"

          densities = {
              "mdpi":    (48, 108),
              "hdpi":    (72, 162),
              "xhdpi":   (96, 216),
              "xxhdpi":  (144, 324),
              "xxxhdpi": (192, 432),
          }

          for dpi, (legacy_px, fg_px) in densities.items():
              folder = os.path.join(res_dir, f"mipmap-{dpi}")
              os.makedirs(folder, exist_ok=True)
              legacy = ImageOps.fit(src, (legacy_px, legacy_px), Image.Resampling.LANCZOS)
              legacy.save(os.path.join(folder, "ic_launcher.png"))
              legacy.save(os.path.join(folder, "ic_launcher_round.png"))
              fg = ImageOps.fit(src, (fg_px, fg_px), Image.Resampling.LANCZOS)
              fg.save(os.path.join(folder, "ic_launcher_foreground.png"))

          os.makedirs(os.path.join(res_dir, "mipmap-anydpi-v26"), exist_ok=True)
          os.makedirs(os.path.join(res_dir, "values"), exist_ok=True)

          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background" />\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\n'
              '</adaptive-icon>\n'
          )
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(os.path.join(res_dir, "mipmap-anydpi-v26", name), "w", encoding="utf-8") as f:
                  f.write(adaptive_xml)

          colors_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="ic_launcher_background">#100F0E</color>\n'
              '</resources>\n'
          )
          with open(os.path.join(res_dir, "values", "colors.xml"), "w", encoding="utf-8") as f:
              f.write(colors_xml)
          EOF

          cp -r build/web/* android_native/app/src/main/assets/public/

          # Patch Android-only index.html for exact 1:1 touch alignment & centered 2:1 fit
          python3 - << 'EOF'
          import pathlib, re
          p = pathlib.Path("android_native/app/src/main/assets/public/index.html")
          html = p.read_text(encoding="utf-8")
          if not html.lstrip().lower().startswith("<!doctype"):
              html = "<!DOCTYPE html>\n" + html
          html = re.sub(r'<meta[^>]*name=["\']viewport["\'][^>]*>', '', html, flags=re.IGNORECASE)
          wide_head = (
              "<head>"
              '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">'
              "<style>"
              "html, body { margin:0 !important; padding:0 !important; width:100vw !important; height:100vh !important; "
              "overflow:hidden !important; background:#100f0e !important; zoom:1 !important; "
              "display:block !important; position:relative !important; touch-action:none; }"
              "</style>"
              "<script>"
              "function fitDtesseraCanvas() {"
              "  var c = document.getElementById('canvas') || document.querySelector('canvas');"
              "  if (!c) return;"
              "  var vw = window.innerWidth || document.documentElement.clientWidth;"
              "  var vh = window.innerHeight || document.documentElement.clientHeight;"
              "  var w = Math.floor(Math.min(vw, vh * 2));"
              "  var h = Math.floor(w / 2);"
              "  var left = Math.max(0, Math.floor((vw - w) / 2));"
              "  var top = Math.max(0, Math.floor((vh - h) / 2));"
              "  c.style.setProperty('position', 'fixed', 'important');"
              "  c.style.setProperty('left', left + 'px', 'important');"
              "  c.style.setProperty('top', top + 'px', 'important');"
              "  c.style.setProperty('width', w + 'px', 'important');"
              "  c.style.setProperty('height', h + 'px', 'important');"
              "  c.style.setProperty('right', 'auto', 'important');"
              "  c.style.setProperty('bottom', 'auto', 'important');"
              "  c.style.setProperty('margin', '0', 'important');"
              "  c.style.setProperty('transform', 'none', 'important');"
              "}"
              "window.addEventListener('resize', fitDtesseraCanvas);"
              "window.addEventListener('orientationchange', fitDtesseraCanvas);"
              "setInterval(fitDtesseraCanvas, 250);"
              "</script>"
          )
          html = html.replace("<head>", wide_head, 1)
          p.write_text(html, encoding="utf-8")
          EOF

          # Rename .gz files so Android AAPT does not strip or decompress them
          find android_native/app/src/main/assets/public -type f -name "*.gz" -exec sh -c 'mv "$1" "$1.asset"' _ {} \;

          cat << 'EOF' > android_native/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DtesseraTerra"
          include ':app'
          EOF

          cat << 'EOF' > android_native/build.gradle
          plugins { id 'com.android.application' version '8.7.2' apply false }
          EOF

          cat << 'EOF' > android_native/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > android_native/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.noburu.dtesseraterra'
              compileSdk 35
              defaultConfig {
                  applicationId "com.noburu.dtesseraterra"
                  minSdk 26
                  targetSdk 35
                  versionCode 4
                  versionName "1.2"
              }
              androidResources {
                  noCompress += ['apk', 'asset', 'gz', 'tar', 'wasm', 'data', 'whl', 'zip']
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }
          EOF

          cat << 'EOF' > android_native/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Dtessera Terra"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_native/app/src/main/java/com/noburu/dtesseraterra/MainActivity.java
          package com.noburu.dtesseraterra;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.ConsoleMessage;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayDeque;
          import java.util.Deque;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;
              private ScrollView logScroll;
              private LinearLayout btnBar;
              private TextView debugOverlay;
              private final Deque<String> logs = new ArrayDeque<>();
              private int secretTapCount = 0;
              private long lastSecretTapMs = 0;

              private void appendLog(String line, boolean showNow) {
                  runOnUiThread(() -> {
                      if (logs.size() >= 60) logs.removeFirst();
                      logs.addLast(line);
                      StringBuilder sb = new StringBuilder("Tap box to hide (or tap COPY top-right):\n");
                      for (String s : logs) sb.append(s).append("\n");
                      debugOverlay.setText(sb.toString());
                      if (showNow) {
                          btnBar.setVisibility(View.VISIBLE);
                          logScroll.setVisibility(View.VISIBLE);
                      }
                  });
              }

              private byte[] readAllBytes(InputStream is) throws Exception {
                  ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                  byte[] chunk = new byte[16384];
                  int nRead;
                  while ((nRead = is.read(chunk, 0, chunk.length)) != -1) {
                      buffer.write(chunk, 0, nRead);
                  }
                  is.close();
                  return buffer.toByteArray();
              }

              private InputStream openPublicAsset(String path) throws Exception {
                  String clean = path.startsWith("/") ? path.substring(1) : path;
                  if (clean.isEmpty()) clean = "index.html";
                  if (clean.endsWith(".gz")) {
                      try {
                          return getAssets().open("public/" + clean + ".asset");
                      } catch (Exception ignored) {}
                  }
                  return getAssets().open("public/" + clean);
              }

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  );

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#100F0E"));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#100F0E"));
                  root.addView(webView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ));

                  logScroll = new ScrollView(this);
                  logScroll.setBackgroundColor(Color.argb(225, 0, 0, 0));
                  logScroll.setVisibility(View.GONE);

                  debugOverlay = new TextView(this);
                  debugOverlay.setTextColor(Color.GREEN);
                  debugOverlay.setTextSize(11);
                  debugOverlay.setPadding(24, 24, 24, 24);
                  debugOverlay.setOnClickListener(v -> {
                      logScroll.setVisibility(View.GONE);
                      btnBar.setVisibility(View.GONE);
                  });
                  logScroll.addView(debugOverlay);

                  root.addView(logScroll, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ));

                  // Clean beta UI: hidden by default; tap top-right corner 5x quickly to reveal
                  btnBar = new LinearLayout(this);
                  btnBar.setOrientation(LinearLayout.HORIZONTAL);
                  btnBar.setVisibility(View.GONE);

                  TextView copyBtn = new TextView(this);
                  copyBtn.setText("COPY");
                  copyBtn.setTextColor(Color.WHITE);
                  copyBtn.setBackgroundColor(Color.argb(180, 0, 80, 0));
                  copyBtn.setTextSize(10);
                  copyBtn.setPadding(16, 10, 16, 10);
                  copyBtn.setOnClickListener(v -> {
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      if (cm != null) {
                          cm.setPrimaryClip(ClipData.newPlainText("DtesseraLog", debugOverlay.getText()));
                          Toast.makeText(this, "Logs copied to clipboard", Toast.LENGTH_SHORT).show();
                      }
                  });
                  btnBar.addView(copyBtn);

                  TextView logBtn = new TextView(this);
                  logBtn.setText("HIDE");
                  logBtn.setTextColor(Color.WHITE);
                  logBtn.setBackgroundColor(Color.argb(180, 90, 0, 0));
                  logBtn.setTextSize(10);
                  logBtn.setPadding(16, 10, 16, 10);
                  logBtn.setOnClickListener(v -> {
                      logScroll.setVisibility(View.GONE);
                      btnBar.setVisibility(View.GONE);
                  });
                  btnBar.addView(logBtn);

                  root.addView(btnBar, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP | Gravity.END
                  ));

                  View secretCorner = new View(this);
                  secretCorner.setBackgroundColor(Color.TRANSPARENT);
                  secretCorner.setOnClickListener(v -> {
                      long now = System.currentTimeMillis();
                      secretTapCount = (now - lastSecretTapMs < 1200) ? (secretTapCount + 1) : 1;
                      lastSecretTapMs = now;
                      if (secretTapCount >= 5) {
                          secretTapCount = 0;
                          btnBar.setVisibility(View.VISIBLE);
                          logScroll.setVisibility(View.VISIBLE);
                      }
                  });
                  root.addView(secretCorner, new FrameLayout.LayoutParams(
                      72, 72, Gravity.TOP | Gravity.END
                  ));

                  setContentView(root);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage cm) {
                          String msg = cm.message();
                          boolean ignore = msg.contains("BrowserFS not found");
                          boolean isErr = !ignore && (
                                  msg.contains("Traceback")
                                  || msg.contains("ReadError")
                                  || msg.contains("SyntaxError")
                                  || msg.contains("UnboundLocalError")
                                  || msg.contains("ModuleNotFoundError")
                                  || msg.contains("Exception")
                          );
                          appendLog("[" + cm.messageLevel() + "] " + msg, isErr);
                          return true;
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          String url = request.getUrl().toString();
                          if (!url.endsWith("favicon.ico")) {
                              appendLog("NET ERR: " + url + " -> " + error.getDescription(), true);
                          }
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if ("appassets.androidplatform.net".equals(uri.getHost())) {
                              String path = uri.getPath();
                              if (path == null || path.isEmpty() || "/".equals(path)) path = "/index.html";

                              Map<String, String> headers = new HashMap<>();
                              headers.put("Access-Control-Allow-Origin", "*");
                              headers.put("Access-Control-Allow-Methods", "GET, HEAD, OPTIONS");
                              headers.put("Access-Control-Allow-Headers", "*");

                              if ("OPTIONS".equalsIgnoreCase(request.getMethod())) {
                                  return new WebResourceResponse(
                                      "text/plain", "UTF-8", 200, "OK", headers,
                                      new ByteArrayInputStream(new byte[0])
                                  );
                              }

                              try {
                                  byte[] bytes = readAllBytes(openPublicAsset(path));
                                  String mime = "application/octet-stream";
                                  String encoding = null;

                                  if (path.endsWith(".html")) { mime = "text/html"; encoding = "UTF-8"; }
                                  else if (path.endsWith(".js")) { mime = "application/javascript"; encoding = "UTF-8"; }
                                  else if (path.endsWith(".css")) { mime = "text/css"; encoding = "UTF-8"; }
                                  else if (path.endsWith(".json")) { mime = "application/json"; encoding = "UTF-8"; }
                                  else if (path.endsWith(".svg")) { mime = "image/svg+xml"; encoding = "UTF-8"; }
                                  else if (path.endsWith(".wasm")) { mime = "application/wasm"; }
                                  else if (path.endsWith(".png")) { mime = "image/png"; }
                                  else if (path.endsWith(".apk")) { mime = "application/zip"; }
                                  else if (path.endsWith(".gz")) { mime = "application/gzip"; }
                                  else if (path.endsWith(".tar")) { mime = "application/x-tar"; }

                                  headers.put("Content-Length", String.valueOf(bytes.length));
                                  appendLog("LOCAL 200 " + path + " (" + bytes.length + " B)", false);

                                  InputStream body = "HEAD".equalsIgnoreCase(request.getMethod())
                                      ? new ByteArrayInputStream(new byte[0])
                                      : new ByteArrayInputStream(bytes);
                                  return new WebResourceResponse(mime, encoding, 200, "OK", headers, body);
                              } catch (Exception e) {
                                  if (!path.endsWith("favicon.ico")) {
                                      appendLog("404 LOCAL: " + path, true);
                                  }
                                  return new WebResourceResponse(
                                      "text/plain", "UTF-8", 404, "Not Found", headers,
                                      new ByteArrayInputStream("Not Found".getBytes(StandardCharsets.UTF_8))
                                  );
                              }
                          }
                          return null;
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/index.html?wide=1");
              }

              @Override
              public void onBackPressed() {}
          }
          EOF

          cd android_native
          gradle assembleDebug --no-daemon

      - name: Upload Android Beta APK
        uses: actions/upload-artifact@v7
        with:
          name: Dtessera_Terra_Android_Beta
          path: android_native/app/build/outputs/apk/debug/app-debug.apk
          
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
