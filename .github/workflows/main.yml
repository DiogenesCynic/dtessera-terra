name: Build Dtessera Terra (Windows, Mac, Web, Android, linux)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller
          pyinstaller --noconsole --onefile --clean --name "Dtessera_Terra" "Dtessera Terra.py"
      - uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Windows_Beta
          path: dist/Dtessera_Terra.exe

  build_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller
          pyinstaller --noconsole --onedir --clean --name "Dtessera_Terra" "Dtessera Terra.py"
          cd dist && zip -r -q Dtessera_Terra_Mac.app.zip Dtessera_Terra.app
      - uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Mac_Beta
          path: dist/Dtessera_Terra_Mac.app.zip

  build_android_and_web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12, JDK 21 & Gradle 8.11.1
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Prepare Mobile-Safe Source & Build Pygbag Bundle
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pygbag

          # Remove non-game helper scripts so Pygbag only packs the game
          rm -f "Item Inventory.py" simulate_1000.py generate_map.py main.py

          python3 - << 'EOF'
          import pathlib, re

          src = pathlib.Path("Dtessera Terra.py").read_text(encoding="utf-8")

          if "import asyncio" not in src:
              src = "import asyncio\n" + src

          # Replace slow desktop SysFont scans with instant built-in Pygame font
          sysfont_patch = (
              "import pygame\n"
              "pygame.font.init()\n"
              "_orig_font = pygame.font.Font\n"
              "pygame.font.SysFont = lambda name, size, bold=False, italic=False: _orig_font(None, int(size * 1.22))\n"
          )
          src = src.replace("import pygame", sysfont_patch, 1)
          src = src.replace("pygame.Surface((WIDTH, HEIGHT)).convert()", "pygame.Surface((WIDTH, HEIGHT))")

          # Guarantee every frame yields to the mobile browser event loop
          src = re.sub(
              r'(\s+while\s+True\s*:\s*\n)(\s+)',
              r'\1\2await asyncio.sleep(0)\n\2',
              src,
              count=1
          )
          src = re.sub(
              r'if\s+__name__\s*==\s*["\']__main__["\']\s*:\s*\n\s*asyncio\.run\(main\(\)\)',
              'asyncio.run(main())',
              src
          )
          if "asyncio.run(main())" not in src:
              src += "\nasyncio.run(main())\n"

          pathlib.Path("main.py").write_text(src, encoding="utf-8")
          pathlib.Path("Dtessera Terra.py").unlink()
          EOF

          pygbag --ume_block 0 --build .
          sed -i 's/autorun : 0/autorun : 1/g' build/web/index.html
          (cd build/web && zip -r -q ../web.zip .)

      - name: Upload Web & iOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Web_Beta
          path: build/web.zip

      - name: Build Pure Native Android SDK 35 APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          mkdir -p android_native/app/src/main/java/com/noburu/dtesseraterra
          mkdir -p android_native/app/src/main/assets/public

          cp -r build/web/* android_native/app/src/main/assets/public/

          cat << 'EOF' > android_native/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DtesseraTerra"
          include ':app'
          EOF

          cat << 'EOF' > android_native/build.gradle
          plugins { id 'com.android.application' version '8.7.2' apply false }
          EOF

          cat << 'EOF' > android_native/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > android_native/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.noburu.dtesseraterra'
              compileSdk 35
              defaultConfig {
                  applicationId "com.noburu.dtesseraterra"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }
          EOF

          cat << 'EOF' > android_native/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Dtessera Terra"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_native/app/src/main/java/com/noburu/dtesseraterra/MainActivity.java
          package com.noburu.dtesseraterra;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if ("appassets.androidplatform.net".equals(uri.getHost())) {
                              String path = uri.getPath();
                              if (path == null || path.isEmpty() || "/".equals(path)) path = "/index.html";
                              try {
                                  InputStream is = getAssets().open("public" + path);
                                  String mime = "application/octet-stream";
                                  if (path.endsWith(".html")) mime = "text/html";
                                  else if (path.endsWith(".js")) mime = "application/javascript";
                                  else if (path.endsWith(".wasm")) mime = "application/wasm";
                                  else if (path.endsWith(".png")) mime = "image/png";
                                  else if (path.endsWith(".css")) mime = "text/css";
                                  else if (path.endsWith(".json")) mime = "application/json";

                                  Map<String, String> headers = new HashMap<>();
                                  headers.put("Access-Control-Allow-Origin", "*");
                                  return new WebResourceResponse(mime, "UTF-8", 200, "OK", headers, is);
                              } catch (Exception e) {
                                  return new WebResourceResponse("text/plain", "UTF-8", 404, "Not Found", null, null);
                              }
                          }
                          return null;
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/index.html");
              }

              @Override
              public void onBackPressed() {}
          }
          EOF

          cd android_native
          gradle assembleDebug --no-daemon

      - name: Upload Android Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Android_Beta
          path: android_native/app/build/outputs/apk/debug/app-debug.apk
          
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygame and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
      - name: Build Linux Binary
        run: |
          pyinstaller --noconsole --onefile --clean --name "Dtessera_Terra" "Dtessera Terra.py"
      - name: Upload Linux Beta
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Linux_Beta
          path: dist/Dtessera_Terra
