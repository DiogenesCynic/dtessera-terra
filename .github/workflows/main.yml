name: Build Mac, Windows, Web and Android Beta

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygame and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
      - name: Build Windows EXE
        run: |
          pyinstaller --noconsole --onefile --clean --name "Dtessera_Terra" "Dtessera Terra.py"
      - name: Upload Windows Beta
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Windows_Beta
          path: dist/Dtessera_Terra.exe

  build_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygame and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
      - name: Build macOS App
        run: |
          pyinstaller --noconsole --onedir --clean --name "Dtessera_Terra" "Dtessera Terra.py"
          cd dist && zip -r Dtessera_Terra_Mac.app.zip Dtessera_Terra.app
      - name: Upload Mac Beta
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Mac_Beta
          path: dist/Dtessera_Terra_Mac.app.zip

  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygame and Pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pygbag
      - name: Build WebAssembly Archive
        run: |
          pygbag --build --archive .
      - name: Upload Web Beta
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Web_Beta
          path: build/web.zip  

  build_android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Pygbag WebAssembly Bundle
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pygbag
          pygbag --build --archive .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Package into Standalone Android APK
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          npm install -g cordova
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          cordova create android_app com.noburu.dtesseraterra "Dtessera Terra"
          cd android_app
          rm -rf www/*
          unzip -q ../build/web.zip -d www/
          sed -i 's|</widget>|    <preference name="Orientation" value="landscape" />\n    <preference name="Fullscreen" value="true" />\n    <preference name="Hostname" value="localhost" />\n    <preference name="Scheme" value="https" />\n</widget>|' config.xml
          cordova platform add android@13.0.0
          cordova build android --debug
          mkdir -p ../bin
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../bin/Dtessera_Terra_Android_Beta.apk

      - name: Upload Android Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Android_Beta
          path: bin/Dtessera_Terra_Android_Beta.apk
