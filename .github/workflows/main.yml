name: Build Mac, Windows, Web, linux, and Android Beta

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygame and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
      - name: Build Windows EXE
        run: |
          pyinstaller --noconsole --onefile --clean --name "Dtessera_Terra" "Dtessera Terra.py"
      - name: Upload Windows Beta
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Windows_Beta
          path: dist/Dtessera_Terra.exe

  build_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygame and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
      - name: Build macOS App
        run: |
          pyinstaller --noconsole --onedir --clean --name "Dtessera_Terra" "Dtessera Terra.py"
          cd dist && zip -r Dtessera_Terra_Mac.app.zip Dtessera_Terra.app
      - name: Upload Mac Beta
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Mac_Beta
          path: dist/Dtessera_Terra_Mac.app.zip

  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygame and Pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pygbag
      - name: Build WebAssembly Archive
        run: |
          pygbag --build --archive .
      - name: Upload Web Beta
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Web_Beta
          path: build/web.zip
  build_android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install System Dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer virtualenv Cython==0.29.33
      - name: Build Android APK
        run: |
          yes | buildozer android debug
      - name: Upload Android Beta
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Android_Beta
          path: bin/*.apk
  
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygame and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
      - name: Build Linux Binary
        run: |
          pyinstaller --noconsole --onefile --clean --name "Dtessera_Terra" "Dtessera Terra.py"
      - name: Upload Linux Beta
        uses: actions/upload-artifact@v4
        with:
          name: Dtessera_Terra_Linux_Beta
          path: dist/Dtessera_Terra
