\outl0\strokewidth0 \strokec2 name: Build Mac and Windows Beta\
\
on:\
  workflow_dispatch:\
  push:\
    branches: [ main ]\
\
jobs:\
  build_windows:\
    runs-on: windows-latest\
    steps:\
      - uses: actions/checkout@v4\
      - uses: actions/setup-python@v5\
        with:\
          python-version: '3.11'\
      - name: Install dependencies\
        run: |\
          python -m pip install --upgrade pip\
          pip install pygame pyinstaller\
      - name: Build Windows EXE\
        run: |\
          pyinstaller --noconsole --onefile --clean --name "Dtessera_Terra" "Dtessera Terra.py"\
      - name: Upload Windows Beta\
        uses: actions/upload-artifact@v4\
        with:\
          name: Dtessera_Terra_Windows_Beta\
          path: dist/Dtessera_Terra.exe\
\
  build_mac:\
    runs-on: macos-latest\
    steps:\
      - uses: actions/checkout@v4\
      - uses: actions/setup-python@v5\
        with:\
          python-version: '3.11'\
      - name: Install dependencies\
        run: |\
          python -m pip install --upgrade pip\
          pip install pygame pyinstaller\
      - name: Build macOS App\
        run: |\
          pyinstaller --noconsole --onedir --clean --name "Dtessera_Terra" "Dtessera Terra.py"\
          cd dist && zip -r Dtessera_Terra_Mac.app.zip Dtessera_Terra.app\
      - name: Upload Mac Beta\
        uses: actions/upload-artifact@v4\
        with:\
          name: Dtessera_Terra_Mac_Beta\
          path: dist/Dtessera_Terra_Mac.app.zip}